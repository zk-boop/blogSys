services:
  mysql:
    image: mysql:8.0
    container_name: blogsys-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: blog_sys
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docs/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-123456}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    container_name: blogsys-backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/blog_sys?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      JWT_SECRET: ${JWT_SECRET:-blogsys-dev-secret-key-please-change-in-production-0123456789}
      UPLOAD_DIR: /app/uploads
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
    volumes:
      - upload-data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8082:8080"

  frontend:
    build: ./frontend
    container_name: blogsys-frontend
    depends_on:
      - backend
    ports:
      - "8081:80"

volumes:
  mysql-data:
  upload-data:
