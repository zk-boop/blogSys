spring:
  application:
    name: blogsys-backend
  profiles:
    active: local
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: 8080

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

blogsys:
  jwt:
    secret: blogsys-dev-secret-key-please-change-in-production-0123456789
    expire-hours: 72
  upload:
    dir: uploads
