spring:
  application:
    name: blogsys-backend
  # 这里**刻意不设默认 profile**。
  #
  # 此前写的是 `profiles.active: local`,而 local 是"允许用默认 JWT 密钥启动"的那一个
  # (见 config/StartupSecurityPolicy)—— 于是部署者什么都不配、直接 java -jar 就落在 local 上,
  # 那道 fail-fast 永远不会触发:一道被默认值悄悄关掉的护栏,等于没有护栏。
  #
  # 现在:不指定 profile 就用哪套配置都是显式的。本地开发加 `-Dspring-boot.run.profiles=local`
  # (或 --spring.profiles.active=local),生产必须显式给 JWT_SECRET 与 DB_* 环境变量。
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/blog_sys?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

server:
  port: 8080

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

blogsys:
  jwt:
    secret: ${JWT_SECRET:blogsys-dev-secret-key-please-change-in-production-0123456789}
    expire-hours: 72
  upload:
    dir: ${UPLOAD_DIR:uploads}
  ai:
    base-url: ${AI_BASE_URL:https://api.openai.com/v1}
    api-key: ${AI_API_KEY:${AI_LLM_API_KEY:}}
    model: ${AI_MODEL:gpt-4o-mini}
    timeout-seconds: 120

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
